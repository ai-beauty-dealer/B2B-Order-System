<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出荷PDF取込</title>
  <style>
    :root {
      --paper: #f5f1e8;
      --paper-strong: #fffdf7;
      --ink: #17202a;
      --muted: #697077;
      --line: #c9c2b4;
      --accent: #d85b2a;
      --accent-dark: #9d3615;
      --ok: #1f6b52;
      --warn: #9b6416;
      --danger: #a52f2f;
      --shadow: 0 12px 30px rgba(23, 32, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 32, 42, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 100% 24px;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      font-size: 13px;
      line-height: 1.55;
    }

    .shell { padding: 20px 18px 28px; }

    .masthead {
      padding: 0 0 15px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--accent-dark);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 25px;
      letter-spacing: 0.05em;
      line-height: 1.25;
    }

    .lead { margin: 7px 0 0; color: var(--muted); }

    .step {
      position: relative;
      margin: 0 0 14px;
      padding: 15px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 247, 0.92);
      box-shadow: 0 2px 0 rgba(23, 32, 42, 0.05);
    }

    .step::before {
      content: attr(data-step);
      position: absolute;
      top: -9px;
      left: 12px;
      padding: 1px 7px;
      color: var(--paper-strong);
      background: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .step-title { margin: 2px 0 10px; font-size: 14px; }

    .file-box {
      display: block;
      padding: 16px 12px;
      border: 1px dashed #8c8476;
      background: #faf7ef;
      text-align: center;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
    }

    .file-box:hover {
      border-color: var(--accent);
      background: #fff8ed;
      transform: translateY(-1px);
    }

    .file-box input { display: none; }
    .file-main { display: block; font-weight: 700; }
    .file-name { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; word-break: break-all; }

    button {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--ink);
      border-radius: 0;
      color: var(--paper-strong);
      background: var(--ink);
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    button:disabled { cursor: not-allowed; opacity: 0.42; }
    button.primary { border-color: var(--accent-dark); background: var(--accent); }

    .actions { margin-top: 12px; }

    .status {
      display: none;
      margin: 12px 0 0;
      padding: 9px 10px;
      border-left: 4px solid var(--ink);
      background: #ebe6da;
      color: var(--ink);
      white-space: pre-wrap;
    }

    .status.show { display: block; }
    .status.ok { border-color: var(--ok); color: var(--ok); }
    .status.warn { border-color: var(--warn); color: var(--warn); }
    .status.error { border-color: var(--danger); color: var(--danger); }

    .summary { display: none; }
    .summary.show { display: block; }

    .date-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 11px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      min-height: 72px;
      padding: 10px;
      border: 1px solid var(--line);
      background: #faf7ef;
    }

    .metric strong {
      display: block;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 24px;
      line-height: 1.05;
    }

    .metric span { color: var(--muted); font-size: 11px; }
    .metric.stockout strong { color: var(--danger); }
    .metric.external strong { color: var(--accent-dark); }

    .sheet-list { margin: 10px 0 0; padding: 0; list-style: none; }
    .sheet-list li {
      padding: 7px 0;
      border-top: 1px dotted var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    .sheet-list b { color: var(--ink); }

    .footnote { margin: 10px 0 0; color: var(--muted); font-size: 10px; }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      vertical-align: -2px;
      animation: spin 650ms linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <?!= includeShippingImportFile_('shipping_pdf_parser'); ?>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <p class="eyebrow">Shipping reconciliation</p>
      <h1>出荷PDF取込</h1>
      <p class="lead">欠品数と、発注サイト外の商品だけを反映する。</p>
    </header>

    <section class="step" data-step="01 SELECT">
      <h2 class="step-title">倉庫入出庫一覧表を選ぶ</h2>
      <label class="file-box" for="pdfFile">
        <span class="file-main">PDFを選択</span>
        <span class="file-name" id="fileName">未選択</span>
        <input id="pdfFile" type="file" accept="application/pdf,.pdf">
      </label>
      <div class="actions">
        <button id="analyzeButton" type="button" disabled>PDFを解析する</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section id="summary" class="step summary" data-step="02 CHECK">
      <h2 class="step-title">反映前の確認</h2>
      <div class="date-line">
        <span id="targetDate">----</span>
        <span id="duplicateState">未反映</span>
      </div>
      <div class="metrics">
        <div class="metric"><strong id="pdfItems">0</strong><span>PDF商品明細</span></div>
        <div class="metric"><strong id="matchedItems">0</strong><span>発注サイト照合</span></div>
        <div class="metric stockout"><strong id="stockoutQty">0</strong><span>欠品合計数</span></div>
        <div class="metric external"><strong id="externalRows">0</strong><span>サイト外追加行</span></div>
      </div>
      <ul id="sheetList" class="sheet-list"></ul>
      <p class="footnote">既存注文はI列へ欠品数を記入。サイト外商品は最下部のB〜D列だけへ追加する。</p>
    </section>

    <section id="applySection" class="step summary" data-step="03 APPLY">
      <h2 class="step-title">シートへ反映</h2>
      <button id="applyButton" class="primary" type="button" disabled>この内容で反映する</button>
    </section>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('pdfFile');
    const fileName = document.getElementById('fileName');
    const analyzeButton = document.getElementById('analyzeButton');
    const applyButton = document.getElementById('applyButton');
    const statusBox = document.getElementById('status');
    const summarySection = document.getElementById('summary');
    const applySection = document.getElementById('applySection');
    let parsedPayload = null;

    fileInput.addEventListener('change', function() {
      const file = fileInput.files && fileInput.files[0];
      fileName.textContent = file ? file.name : '未選択';
      analyzeButton.disabled = !file;
      applyButton.disabled = true;
      parsedPayload = null;
      summarySection.classList.remove('show');
      applySection.classList.remove('show');
      clearStatus();
    });

    analyzeButton.addEventListener('click', async function() {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      setBusy(analyzeButton, true, '解析中');
      applyButton.disabled = true;
      showStatus('PDFの列を読み取っている……', '');

      try {
        const buffer = await file.arrayBuffer();
        const fileHash = await sha256(buffer);
        const pages = await extractPdfPages(buffer);
        parsedPayload = ShippingPdfParser.parsePages(pages, {
          fileName: file.name,
          fileHash: fileHash
        });

        const itemCount = parsedPayload.groups.reduce(function(sum, group) {
          return sum + group.items.length;
        }, 0);
        if (!parsedPayload.documentDate || itemCount === 0) {
          throw new Error('日付または商品明細を読み取れなかった。倉庫入出庫一覧表のPDFか確認して。');
        }

        showStatus('スプレッドシートと照合している……', '');
        google.script.run
          .withSuccessHandler(function(result) {
            setBusy(analyzeButton, false, 'PDFを解析する');
            showPreview(result);
          })
          .withFailureHandler(function(error) {
            setBusy(analyzeButton, false, 'PDFを解析する');
            showFailure(error);
          })
          .previewShippingImport(parsedPayload);
      } catch (error) {
        setBusy(analyzeButton, false, 'PDFを解析する');
        showFailure(error);
      }
    });

    applyButton.addEventListener('click', function() {
      if (!parsedPayload) return;
      setBusy(applyButton, true, '反映中');
      showStatus('I列の欠品数と、サイト外商品を反映している……', '');

      google.script.run
        .withSuccessHandler(function(result) {
          setBusy(applyButton, false, '反映済み');
          applyButton.disabled = true;
          document.getElementById('duplicateState').textContent = '反映済み';
          showStatus(
            '反映完了\n欠品合計: ' + result.summary.stockoutQty +
            '\n欠品リスト: ' + result.summary.stockoutListRows + '行' +
            '\nサイト外追加: ' + result.summary.externalRowsToAppend + '行',
            'ok'
          );
        })
        .withFailureHandler(function(error) {
          setBusy(applyButton, false, 'この内容で反映する');
          showFailure(error);
        })
        .applyShippingImport(parsedPayload);
    });

    async function extractPdfPages(buffer) {
      const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(buffer.slice(0)) });
      const pdf = await loadingTask.promise;
      const pages = [];

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
        const page = await pdf.getPage(pageNumber);
        const viewport = page.getViewport({ scale: 1 });
        const content = await page.getTextContent();
        pages.push({
          pageNumber: pageNumber,
          width: viewport.width,
          height: viewport.height,
          items: content.items.map(function(item) {
            return {
              text: item.str,
              x: item.transform[4],
              y: item.transform[5],
              width: item.width || 0
            };
          })
        });
      }
      return pages;
    }

    async function sha256(buffer) {
      if (!window.crypto || !window.crypto.subtle) return '';
      const digest = await window.crypto.subtle.digest('SHA-256', buffer.slice(0));
      return Array.from(new Uint8Array(digest)).map(function(byte) {
        return byte.toString(16).padStart(2, '0');
      }).join('');
    }

    function showPreview(result) {
      document.getElementById('targetDate').textContent = result.documentDate;
      document.getElementById('duplicateState').textContent = result.alreadyImported ? '反映済み' : '未反映';
      document.getElementById('pdfItems').textContent = result.summary.pdfItems;
      document.getElementById('matchedItems').textContent = result.summary.matchedItems;
      document.getElementById('stockoutQty').textContent = result.summary.stockoutQty;
      document.getElementById('externalRows').textContent = result.summary.externalRowsToAppend;

      const list = document.getElementById('sheetList');
      list.replaceChildren();
      result.targetSheets.forEach(function(target) {
        const item = document.createElement('li');
        const name = document.createElement('b');
        name.textContent = target.sheetName;
        item.appendChild(name);
        item.appendChild(document.createTextNode(
          '　照合 ' + target.matchedItems +
          ' / 欠品 ' + target.stockoutQty +
          ' / サイト外 ' + target.externalRowsToAppend +
          (target.willCreateSheet ? ' / 新規作成' : '') +
          (target.routingNote ? ' / ' + target.routingNote : '')
        ));
        list.appendChild(item);
      });

      summarySection.classList.add('show');
      applySection.classList.add('show');
      applyButton.disabled = result.alreadyImported;

      if (result.alreadyImported) {
        showStatus('このPDFは反映済み。二重取込はしない。', 'warn');
      } else {
        showStatus('解析完了。数字を確認してから反映して。', 'ok');
      }
    }

    function setBusy(button, busy, label) {
      button.disabled = busy;
      button.innerHTML = busy ? '<span class="spinner" aria-hidden="true"></span>' + label : label;
    }

    function showFailure(error) {
      const message = error && error.message ? error.message : String(error || '不明なエラー');
      showStatus(message, 'error');
    }

    function showStatus(message, kind) {
      statusBox.textContent = message;
      statusBox.className = 'status show' + (kind ? ' ' + kind : '');
    }

    function clearStatus() {
      statusBox.textContent = '';
      statusBox.className = 'status';
    }
  </script>
</body>
</html>
